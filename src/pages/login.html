<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acesse o FinanCont para gerenciar suas contas, receitas, despesas e relatórios financeiros.">
  <title>FinanCont | Login de Acesso</title>

  <!-- Folha de estilos da tela de login -->
  <link rel="stylesheet" href="../css/login.css">

  <!-- Script com validações e simulação de autenticação -->
  <script src="../js/login.js" defer></script>
</head>
<body>

  <!-- Container principal centralizado na tela -->
  <main class="login-pagina">
    <div class="login-card">

      <!-- Cabeçalho com logotipo e identificação do sistema -->
      <header class="login-cabecalho">
        <div class="login-logo" aria-hidden="true">
          <!-- Ícone financeiro / escudo de segurança -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <h1>FinanCont</h1>
        <p>Acesse sua conta para gerenciar suas finanças</p>
      </header>

      <!-- Caixa de alerta para erro de autenticação (E-mail ou senha incorretos) -->
      <div id="alerta-geral" class="alerta-geral alerta-erro" role="alert" aria-live="assertive" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
        </svg>
        <span id="alerta-geral-texto"></span>
      </div>

      <!-- Dica com credenciais de demonstração do sistema -->
      <aside class="credenciais-demo" aria-label="Informações de acesso de demonstração">
        <strong>Credenciais de teste:</strong>
        <span>E-mail: <code>admin@financont.com</code></span> | 
        <span>Senha: <code>123456</code></span>
      </aside>

      <!-- Formulário de autenticação: validações tratadas via JavaScript -->
      <form id="form-login" class="formulario-login" novalidate>

        <!-- Campo: E-mail -->
        <div class="campo-grupo">
          <label for="email">E-mail</label>
          <div class="campo-wrapper">
            <input 
              id="email" 
              name="email" 
              type="email" 
              class="campo-input" 
              placeholder="admin@financont.com" 
              autocomplete="email"
              required
            >
          </div>
          <!-- Mensagem de erro específica do e-mail -->
          <span id="erro-email" class="mensagem-erro" aria-live="polite"></span>
        </div>

        <!-- Campo: Senha com link visual 'Esqueci minha senha' -->
        <div class="campo-grupo">
          <div class="campo-rotulo-linha">
            <label for="senha">Senha</label>
            <!-- Link visual conforme solicitado -->
            <a href="#" id="link-esqueci-senha" class="link-esqueci-senha">Esqueci minha senha</a>
          </div>
          <div class="campo-wrapper">
            <input 
              id="senha" 
              name="senha" 
              type="password" 
              class="campo-input" 
              placeholder="Digite sua senha" 
              autocomplete="current-password"
              required
            >
            <!-- Botão para alternar exibição da senha -->
            <button 
              type="button" 
              id="btn-toggle-senha" 
              class="btn-toggle-senha" 
              aria-label="Mostrar senha" 
              title="Mostrar ou ocultar senha"
            >
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>
          </div>
          <!-- Mensagem de erro específica da senha -->
          <span id="erro-senha" class="mensagem-erro" aria-live="polite"></span>
        </div>

        <!-- Botão de Ação: Entrar -->
        <button type="submit" id="btn-entrar" class="btn-entrar">
          <span>Entrar</span>
        </button>

      </form>

      <!-- Rodapé do formulário: navegação de volta para a landing page -->
      <footer class="login-rodape">
        <a href="../../index.html" class="link-voltar">
          <span aria-hidden="true">←</span>
          <span>Voltar para a página inicial</span>
        </a>
      </footer>

    </div>
  </main>

</body>
</html>
